<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="25%" stop-color="#F5B800"/>
      <stop offset="50%" stop-color="#FFF3A8"/>
      <stop offset="75%" stop-color="#D49000"/>
      <stop offset="100%" stop-color="#9E6500"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFF6BD"/>
      <stop offset="60%" stop-color="#E5A600"/>
      <stop offset="100%" stop-color="#A56E00"/>
    </linearGradient>
    <linearGradient id="cupBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A56E00"/>
      <stop offset="25%" stop-color="#F7C830"/>
      <stop offset="45%" stop-color="#FFF9D2"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EBB310"/>
      <stop offset="100%" stop-color="#845200"/>
    </linearGradient>
    <linearGradient id="pedestal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141C1E"/>
      <stop offset="20%" stop-color="#2D3A3E"/>
      <stop offset="50%" stop-color="#495C62"/>
      <stop offset="80%" stop-color="#2D3A3E"/>
      <stop offset="100%" stop-color="#141C1E"/>
    </linearGradient>
    <linearGradient id="baseTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E6500"/>
      <stop offset="50%" stop-color="#FFEB80"/>
      <stop offset="100%" stop-color="#845200"/>
    </linearGradient>
    <radialGradient id="goldSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFDD55"/>
      <stop offset="70%" stop-color="#D49000"/>
      <stop offset="100%" stop-color="#7A4B00"/>
    </radialGradient>
    <radialGradient id="plinthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(184, 244, 74, 0.4)"/>
      <stop offset="100%" stop-color="rgba(184, 244, 74, 0)"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="trophyShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#trophyShadow)">
    <!-- Base Turf Glow -->
    <ellipse cx="150" cy="370" rx="90" ry="18" fill="url(#plinthGlow)" />

    <!-- Marble/Granite Hexagonal Pedestal -->
    <path d="M 90 355 L 210 355 L 225 375 L 75 375 Z" fill="url(#pedestal)" />
    <!-- Pedestal Trim -->
    <rect x="75" y="372" width="150" height="6" rx="2" fill="url(#baseTrim)" />
    <!-- Gold Plaque on base -->
    <rect x="110" y="358" width="80" height="12" rx="2" fill="url(#goldGleam)" />
    <rect x="114" y="361" width="72" height="6" rx="1" fill="#141C1E" opacity="0.8" />
    <text x="150" y="366" font-size="5" font-family="sans-serif" font-weight="900" fill="#FFF4B8" text-anchor="middle" letter-spacing="1">ICC CHAMPION</text>

    <!-- Lower Gold Stem Ring -->
    <ellipse cx="150" cy="342" rx="36" ry="7" fill="url(#baseTrim)" />
    <!-- Stem Column -->
    <path d="M 132 342 C 132 300, 140 260, 143 235 L 157 235 C 160 260, 168 300, 168 342 Z" fill="url(#cupBody)" />
    <!-- Mid Knurled Ring -->
    <ellipse cx="150" cy="275" rx="18" ry="4.5" fill="url(#goldGleam)" />
    <!-- Upper Flared Calyx -->
    <path d="M 141 236 C 130 180, 95 145, 88 120 L 212 120 C 205 145, 170 180, 159 236 Z" fill="url(#cupBody)" />

    <!-- Trophy Handles (Left and Right Sweeping Ornate Pillars) -->
    <!-- Left Handle -->
    <path d="M 90 130 C 50 145, 42 205, 78 245 C 92 260, 115 270, 134 275 C 122 268, 106 256, 96 242 C 70 210, 72 165, 96 142 Z" fill="url(#goldBright)" />
    <!-- Right Handle -->
    <path d="M 210 130 C 250 145, 258 205, 222 245 C 208 260, 185 270, 166 275 C 178 268, 194 256, 204 242 C 230 210, 228 165, 204 142 Z" fill="url(#goldBright)" />

    <!-- Rim / Upper Lip -->
    <ellipse cx="150" cy="120" rx="62" ry="12" fill="url(#cupBody)" />
    <ellipse cx="150" cy="119" rx="56" ry="9" fill="url(#goldBright)" />
    <ellipse cx="150" cy="118" rx="52" ry="7" fill="#845200" />

    <!-- ICC Golden Globe Crest at the top of the trophy cup -->
    <ellipse cx="150" cy="98" rx="36" ry="8" fill="url(#baseTrim)" />
    <circle cx="150" cy="74" r="32" fill="url(#goldSphere)" />
    <!-- Globe Seam / Cricket Seam arc on golden ball -->
    <path d="M 125 58 C 142 66, 158 82, 175 90" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 127 57 C 144 65, 160 81, 177 89" stroke="#7A4B00" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Radiant Star Gleam -->
    <g transform="translate(130, 52) scale(0.6)">
      <polygon points="25,0 30,18 48,25 30,32 25,50 20,32 2,25 20,18" fill="#FFFFFF" opacity="0.95" />
    </g>
    <g transform="translate(200, 140) scale(0.4)">
      <polygon points="25,0 30,18 48,25 30,32 25,50 20,32 2,25 20,18" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>

