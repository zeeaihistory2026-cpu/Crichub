<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgHuddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073B2C" />
      <stop offset="50%" stop-color="#0B513E" />
      <stop offset="100%" stop-color="#04231A" />
    </linearGradient>
    <radialGradient id="stadiumLights" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#B8F44A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jerseyGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#148359" />
      <stop offset="100%" stop-color="#0B513E" />
    </linearGradient>
    <linearGradient id="jerseyAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8F44A" />
      <stop offset="100%" stop-color="#73D122" />
    </linearGradient>
  </defs>

  <!-- Stadium Background -->
  <rect width="400" height="240" fill="url(#bgHuddle)" />
  <rect width="400" height="240" fill="url(#stadiumLights)" />

  <!-- Stadium Floodlights Glow Towers in distance -->
  <g opacity="0.6">
    <circle cx="60" cy="40" r="12" fill="#FFFFFF" opacity="0.8" />
    <circle cx="60" cy="40" r="30" fill="#B8F44A" opacity="0.2" />
    <circle cx="340" cy="40" r="12" fill="#FFFFFF" opacity="0.8" />
    <circle cx="340" cy="40" r="30" fill="#B8F44A" opacity="0.2" />
  </g>

  <!-- Pakistan Team Celebratory Huddle Silhouettes in Jersey Green -->
  <!-- Player 1 (Left Wing) -->
  <g transform="translate(70, 75)">
    <circle cx="30" cy="25" r="16" fill="#D4A373" />
    <!-- Helmet/Cap -->
    <path d="M 14 25 C 14 12, 46 12, 46 25 Z" fill="#0B513E" />
    <path d="M 12 25 L 34 22 L 40 26 Z" fill="#B8F44A" />
    <!-- Jersey Body -->
    <path d="M 10 42 C 15 35, 45 35, 50 42 L 56 120 L 4 120 Z" fill="url(#jerseyGreen)" />
    <!-- Jersey Yellow/Lime Stripe -->
    <path d="M 12 60 L 48 70 L 48 78 L 12 68 Z" fill="url(#jerseyAccent)" />
  </g>

  <!-- Player 2 (Center Left) -->
  <g transform="translate(130, 60)">
    <circle cx="35" cy="26" r="18" fill="#E29578" />
    <!-- Cap -->
    <path d="M 17 26 C 17 12, 53 12, 53 26 Z" fill="#0B513E" />
    <rect x="22" y="24" width="26" height="4" rx="2" fill="#B8F44A" />
    <!-- Raised Arm Celebration -->
    <path d="M 4 80 L 15 30 L 28 36 L 16 90 Z" fill="url(#jerseyGreen)" />
    <!-- Torso -->
    <path d="M 15 45 C 22 38, 48 38, 55 45 L 62 135 L 8 135 Z" fill="url(#jerseyGreen)" />
    <path d="M 16 75 L 54 85 L 54 92 L 16 82 Z" fill="url(#jerseyAccent)" />
    <!-- Text PAKISTAN -->
    <text x="35" y="70" font-size="7" font-family="sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PAKISTAN</text>
  </g>

  <!-- Player 3 (Captain Center) -->
  <g transform="translate(195, 55)">
    <circle cx="35" cy="26" r="19" fill="#D4A373" />
    <!-- Green Cap -->
    <path d="M 16 26 C 16 10, 54 10, 54 26 Z" fill="#0B513E" />
    <circle cx="35" cy="18" r="3" fill="#B8F44A" />
    <!-- Torso -->
    <path d="M 12 45 C 20 38, 50 38, 58 45 L 66 140 L 4 140 Z" fill="url(#jerseyGreen)" />
    <path d="M 14 78 L 56 88 L 56 96 L 14 86 Z" fill="url(#jerseyAccent)" />
    <!-- Both Arms in Air -->
    <path d="M 48 45 L 75 10 L 85 16 L 58 55 Z" fill="url(#jerseyGreen)" />
    <!-- Hand -->
    <circle cx="82" cy="12" r="7" fill="#D4A373" />
  </g>

  <!-- Player 4 (Right Wing) -->
  <g transform="translate(260, 70)">
    <circle cx="30" cy="25" r="16" fill="#C68B59" />
    <path d="M 14 25 C 14 12, 46 12, 46 25 Z" fill="#0B513E" />
    <path d="M 10 42 C 15 35, 45 35, 50 42 L 56 125 L 4 125 Z" fill="url(#jerseyGreen)" />
    <path d="M 12 65 L 48 75 L 48 83 L 12 73 Z" fill="url(#jerseyAccent)" />
  </g>

  <!-- Foreground Grass Gradient -->
  <rect x="0" y="195" width="400" height="45" fill="#04231A" opacity="0.8" />
  <ellipse cx="200" cy="215" rx="180" ry="25" fill="#0B513E" opacity="0.6" />
</svg>

