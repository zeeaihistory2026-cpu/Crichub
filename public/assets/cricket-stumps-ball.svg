<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <!-- Wood Stumps Gradient -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28E4E"/>
      <stop offset="25%" stop-color="#E5B57A"/>
      <stop offset="50%" stop-color="#FDE3B5"/>
      <stop offset="75%" stop-color="#D9A362"/>
      <stop offset="100%" stop-color="#9C6B31"/>
    </linearGradient>
    <linearGradient id="woodBail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE3B5"/>
      <stop offset="50%" stop-color="#D9A362"/>
      <stop offset="100%" stop-color="#8C5C26"/>
    </linearGradient>
    <!-- Cricket Ball Red Leather Gradient -->
    <radialGradient id="leatherRed" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF5454"/>
      <stop offset="35%" stop-color="#D81717"/>
      <stop offset="70%" stop-color="#8E0808"/>
      <stop offset="100%" stop-color="#4F0303"/>
    </radialGradient>
    <!-- Turf Grass Gradient -->
    <linearGradient id="turfGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#083F31"/>
      <stop offset="40%" stop-color="#0E6B4F"/>
      <stop offset="80%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#083F31"/>
    </linearGradient>
    <!-- Ground Shadow -->
    <ellipse id="ballShadow" cx="190" cy="248" rx="34" ry="9" fill="#000000" opacity="0.45" />
    <ellipse id="stumpShadow" cx="95" cy="245" rx="65" ry="10" fill="#000000" opacity="0.35" />
  </defs>

  <!-- Turf Base -->
  <use href="#stumpShadow" />
  <use href="#ballShadow" />
  <ellipse cx="120" cy="250" rx="110" ry="14" fill="url(#turfGreen)" opacity="0.9" />

  <!-- 3 Wooden Stumps -->
  <!-- Left Stump (Off/Leg) -->
  <g>
    <path d="M 52 70 L 64 70 L 62 242 L 54 242 Z" fill="url(#woodGradient)" />
    <path d="M 52 70 C 52 66, 64 66, 64 70 Z" fill="#FDE3B5" />
    <polygon points="54,242 62,242 58,252" fill="#7A4C1C" />
  </g>

  <!-- Middle Stump -->
  <g>
    <path d="M 88 64 L 100 64 L 98 244 L 90 244 Z" fill="url(#woodGradient)" />
    <path d="M 88 64 C 88 60, 100 60, 100 64 Z" fill="#FDE3B5" />
    <polygon points="90,244 98,244 94,254" fill="#7A4C1C" />
  </g>

  <!-- Right Stump -->
  <g>
    <path d="M 124 70 L 136 70 L 134 242 L 126 242 Z" fill="url(#woodGradient)" />
    <path d="M 124 70 C 124 66, 136 66, 136 70 Z" fill="#FDE3B5" />
    <polygon points="126,242 134,242 130,252" fill="#7A4C1C" />
  </g>

  <!-- Bails resting on top of the stumps -->
  <!-- Left Bail (Spans stump 1 to stump 2) -->
  <g>
    <rect x="54" y="61" width="42" height="6" rx="2.5" fill="url(#woodBail)" />
    <rect x="70" y="58" width="10" height="4" rx="1.5" fill="#FDE3B5" />
  </g>

  <!-- Right Bail (Spans stump 2 to stump 3) -->
  <g>
    <rect x="94" y="61" width="42" height="6" rx="2.5" fill="url(#woodBail)" />
    <rect x="110" y="58" width="10" height="4" rx="1.5" fill="#FDE3B5" />
  </g>

  <!-- Cricket Red Leather Ball -->
  <g transform="translate(148, 172)">
    <!-- Ball Core Sphere -->
    <circle cx="42" cy="42" r="40" fill="url(#leatherRed)" />

    <!-- Cricket Ball Raised White Seam Stitch -->
    <path d="M 14 16 C 30 38, 54 62, 70 68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 14 16 C 30 38, 54 62, 70 68" stroke="#D8D8D8" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.85" />
    <path d="M 18 13 C 34 35, 58 59, 74 65" stroke="#4F0303" stroke-width="0.8" opacity="0.5" />

    <!-- Gleam / Highlight on leather -->
    <ellipse cx="30" cy="26" rx="12" ry="7" transform="rotate(-30, 30, 26)" fill="#FFFFFF" opacity="0.45" />
  </g>
</svg>

