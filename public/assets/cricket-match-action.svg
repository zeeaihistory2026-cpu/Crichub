<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="actionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="50%" stop-color="#133C55" />
      <stop offset="100%" stop-color="#08182B" />
    </linearGradient>
    <radialGradient id="floodlightGlow" cx="40%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jerseyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="batWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28E4E" />
      <stop offset="50%" stop-color="#FDE3B5" />
      <stop offset="100%" stop-color="#9C6B31" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#actionBg)" />
  <rect width="400" height="240" fill="url(#floodlightGlow)" />

  <!-- Stadium Lights -->
  <circle cx="90" cy="40" r="14" fill="#FFFFFF" opacity="0.85" />
  <circle cx="310" cy="40" r="14" fill="#FFFFFF" opacity="0.85" />

  <!-- Cricket Pitch Strip in Ground -->
  <polygon points="120,240 280,240 240,160 160,160" fill="#D4A373" opacity="0.6" />

  <!-- Batsman in Indian Blue Jersey playing Shot -->
  <g transform="translate(160, 45)">
    <!-- Helmet with Grill -->
    <circle cx="40" cy="30" r="20" fill="#1E3A8A" />
    <path d="M 40 20 L 60 28 L 56 36 L 40 32 Z" fill="#000080" />
    <!-- Grill lines -->
    <path d="M 46 28 L 56 30 M 46 32 L 56 34" stroke="#D1D5DB" stroke-width="1.5" />
    
    <!-- Torso (Blue Jersey with Orange Accents) -->
    <path d="M 22 52 C 30 45, 55 45, 62 52 L 68 120 L 16 120 Z" fill="url(#jerseyBlue)" />
    <!-- Orange Shoulder stripe -->
    <path d="M 22 52 L 32 50 L 32 58 L 22 60 Z" fill="#FF9933" />
    <path d="M 62 52 L 52 50 L 52 58 L 62 60 Z" fill="#FF9933" />
    <text x="42" y="76" font-size="6.5" font-family="sans-serif" font-weight="900" fill="#FF9933" text-anchor="middle" letter-spacing="1">INDIA</text>

    <!-- Arms swinging English Willow Bat -->
    <path d="M 58 55 L 85 80 L 78 88 L 50 64 Z" fill="url(#jerseyBlue)" />
    <!-- Batting Gloves -->
    <circle cx="84" cy="85" r="7" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />
    <circle cx="88" cy="92" r="7" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />

    <!-- Cricket Bat in powerful drive -->
    <g transform="rotate(25, 90, 95)">
      <!-- Handle -->
      <rect x="88" y="90" width="5" height="24" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
      <!-- Blade -->
      <path d="M 86 114 L 95 114 L 97 185 C 97 188, 84 188, 84 185 Z" fill="url(#batWood)" />
      <!-- Grip wrap & Sticker -->
      <rect x="86" y="122" width="9" height="15" fill="#1E40AF" />
    </g>
  </g>

  <!-- Ground turf bottom -->
  <rect x="0" y="210" width="400" height="30" fill="#04231A" opacity="0.9" />
</svg>

